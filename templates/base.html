<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Crypt{% endblock %}</title>
  <style>
    body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #202124; }
    nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
    main { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; }
    label { display: block; margin-top: 1rem; }
    input { box-sizing: border-box; display: block; width: 100%; max-width: 360px; padding: .5rem; }
    ul { padding-left: 1.25rem; }
  </style>
</head>
<body>
  <nav aria-label="Pages">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('messages') }}">Messages</a>
    <a href="{{ url_for('login') }}">Login</a>
    <a href="{{ url_for('register') }}">Register</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
